behaviors:
  Bullethell:
    trainer_type: ppo
    hyperparameters:
      batch_size:  10000
      buffer_size: 50000
      learning_rate: 0.0002
      beta: 0.0005
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 8
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 1024
      num_layers: 8
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 15000000
    time_horizon: 5000
    summary_freq: 50000
    threaded: true